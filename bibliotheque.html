  <script>
    const cats = ["Tous", ...new Set(FOLIO_MAGAZINES.map(m => m.category))];
    const filters = document.getElementById("filters");
    let current = "Tous";
    function draw() {
      filters.innerHTML = cats.map(c =>
        `<button class="chip ${c===current?"on":""}" data-cat="${c}">${c}</button>`
      ).join("");
      const list = current === "Tous" ? FOLIO_MAGAZINES : FOLIO_MAGAZINES.filter(m => m.category === current);
      renderMagazineGrid("#lib-grid", list);
      filters.querySelectorAll(".chip").forEach(btn => {
        btn.addEventListener("click", () => { current = btn.dataset.cat; draw(); });
      });
    }
    draw();
  </script>
