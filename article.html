<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Article  — La MLS en Français</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="img/logo.png" alt="Logo La MLS en Français">
        <span class="brand-text">
          <span class="brand-mark">MLS</span>
          <span class="brand-sub">en Français</span>
        </span>
      </a>
      <button class="menu-btn" aria-label="Menu">☰</button>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="bibliotheque.html">Magazines</a>
        <a href="articles.html">Articles</a>
        <a href="a-propos.html">À propos</a>
        <a class="nav-cta" href="lire.html?id=mls-n1">Feuilleter</a>
      </nav>
    </div>
  </header>

  <article class="article-layout" id="article-root"></article>

  <section class="comments wrap" id="commentaires">
    <h2>Commentaires</h2>
    <p class="comments-lead">Une question, un souvenir de match, un désaccord ? Écris-le ici.</p>
    <form class="comment-form" name="commentaire" method="POST" data-netlify="true" netlify-honeypot="bot">
      <input type="hidden" name="form-name" value="commentaire">
      <input type="hidden" name="article" id="comment-article" value="">
      <p class="hidden-field"><label>Ne pas remplir <input name="bot"></label></p>
      <label>Nom <input type="text" name="nom" required maxlength="80" placeholder="Ton prénom"></label>
      <label>Message <textarea name="message" required rows="5" maxlength="2000" placeholder="Ton commentaire…"></textarea></label>
      <button class="btn" type="submit">Publier le commentaire</button>
      <p class="comment-note">Le message est envoyé à la rédaction. Il pourra apparaître après relecture.</p>
    </form>
    <p class="comment-thanks" id="comment-thanks" hidden>Merci. Ton commentaire est bien parti.</p>
  </section>

  <footer>
    <div class="wrap footer-inner">
      <div>La MLS en Français</div>
      <div><a href="articles.html">Tous les articles</a></div>
    </div>
  </footer>

  <script src="data/magazines.js"></script>
  <script src="data/articles.js"></script>
  <script src="js/app.js"></script>
  <script src="js/article.js"></script>
</body>
</html>
