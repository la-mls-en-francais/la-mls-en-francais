<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecture  — La MLS en Français</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="reader-page">
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="img/logo.png" alt="Logo La MLS en Français">
        <span class="brand-text">
          <span class="brand-mark">MLS</span>
          <span class="brand-sub">en Français</span>
        </span>
      </a>
      <nav>
        <a href="bibliotheque.html">← Magazines</a>
        <a href="articles.html">Articles</a>
      </nav>
    </div>
  </header>

  <div class="wrap reader-bar">
    <div>
      <div class="reader-title" data-reader-title>Magazine</div>
      <div style="opacity:.7;font-size:.88rem" data-reader-issue></div>
    </div>
    <div class="reader-controls">
      <button class="icon-btn" data-prev>Précédent</button>
      <span><span data-page-current>1</span> / <span data-page-total>—</span></span>
      <button class="icon-btn" data-next>Suivant</button>
      <button class="icon-btn" data-fs>Plein écran</button>
    </div>
  </div>

  <div class="reader-stage">
    <div id="book"></div>
    <div class="embed-wrap" id="embed-host" hidden></div>
  </div>

  <script src="data/magazines.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
