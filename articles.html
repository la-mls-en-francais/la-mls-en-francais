<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Articles  — La MLS en Français</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="img/logo.png" alt="Logo La MLS en Français">
        <span class="brand-text">
          <span class="brand-mark">MLS</span>
          <span class="brand-sub">en Français</span>
        </span>
      </a>
      <button class="menu-btn" aria-label="Menu">☰</button>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="bibliotheque.html">Magazines</a>
        <a href="articles.html">Articles</a>
        <a href="a-propos.html">À propos</a>
        <a class="nav-cta" href="lire.html?id=mls-n1">Feuilleter</a>
      </nav>
    </div>
  </header>

  <section>
    <div class="wrap">
      <p class="eyebrow">Textes</p>
      <h1>Articles</h1>
      <p class="lede">Vos textes déjà écrits — chroniques, éditos, carnets — publiés à côté des magazines, dans la même maison.</p>
      <div class="filters" id="filters"></div>
      <div class="grid-articles" id="art-grid"></div>
    </div>
  </section>

  <footer>
    <div class="wrap footer-inner">
      <div>La MLS en Français</div>
      <div><a href="publier.html">Ajouter un article</a></div>
    </div>
  </footer>

  <script src="data/articles.js"></script>
  <script src="js/app.js"></script>
  <script>
    const cats = ["Tous", ...new Set(FOLIO_ARTICLES.map(a => a.category))];
    const filters = document.getElementById("filters");
    const params = new URLSearchParams(location.search);
    const wanted = params.get("cat");
    const q0 = params.get("q") || "";
    let current = cats.includes(wanted) ? wanted : "Tous";
    function draw() {
      filters.innerHTML = cats.map(c =>
        `<button class="chip ${c===current?"on":""}" data-cat="${c}">${c}</button>`
      ).join("");
      let list = current === "Tous" ? FOLIO_ARTICLES : FOLIO_ARTICLES.filter(a => a.category === current);
      if (q0 && window.searchArticles) list = window.searchArticles(q0).filter(a => current === "Tous" || a.category === current);
      renderArticleGrid("#art-grid", list);
      filters.querySelectorAll(".chip").forEach(btn => {
        btn.addEventListener("click", () => { current = btn.dataset.cat; draw(); });
      });
    }
    draw();
  </script>
</body>
</html>
